<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

    <form action="#" method="post">
        <!-- Nombre de usuario y Email -->
        <label for="nombre">Nombre de usuario</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escriba su nombre">
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Escriba aquí su correo electrónico">
        <br><br>

        <!-- Contraseña -->
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password">
        <br><br>

        <!-- Sexo y País (Menús desplegables) -->
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo">
            <option value="no_especificado">No especificar</option>
            <option value="hombre">hombre</option>
            <option value="mujer">mujer</option>
        </select>

        <label for="pais">Pais</label>
        <select id="pais" name="pais">
            <option value="espana" selected>España</option>
            <option value="mexico">México</option>
            <option value="argentina">Argentina</option>
            <option value="colombia">Colombia</option>
            <option value="chile">Chile</option>
            <option value="peru">Perú</option>
            <option value="colombia">Estados Unidos</option>
        </select>
        <br><br>

        <!-- ¿Cuánto sabes de formularios en HTML? (Barra de rango) -->
        <label for="nivel">¿Cuánto sabes de formularios en HTML?</label>
        <input type="range" id="nivel" name="nivel" min="0" max="100">
        <br><br>

        <!-- Desea suscribirse a nuestro boletín (Radio buttons) -->
        <label>Desea suscribirse a nuestro boletín</label>
        <input type="radio" id="si" name="boletin" value="si">
        <label for="si">Sí</label>
        <input type="radio" id="no" name="boletin" value="no">
        <label for="no">No</label>
        <br><br>

        <!-- Términos de uso (Checkbox) -->
        <input type="checkbox" id="terminos" name="terminos">
        <label for="terminos">He leído y acepto los términos de uso</label>
        <br><br>

        <!-- Botones -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Cancelar">
    </form>

</body>
</html>
