<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamiento relativo y absoluto</title>
    <style>
        #container {
            width: 100%;
            height: 700px;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #caja {
            width: 300px;
            height: 150px;
            background-color: blue;
            position: relative;
            top: 50px;
            right: 50px;
        }

        #cajita {
            width: 30px;
            height: 30px;
            background-color: orange;
            position: absolute;
            top: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="caja">
            <div id="cajita"></div>
        </div>
    </div>
</body>
</html>
