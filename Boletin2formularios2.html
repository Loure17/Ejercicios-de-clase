
<!DOCTYPE html>
<html>
<head>
    <title>Entrega tu CV</title>
    <meta charset="UTF-8">
</head>
<body>

    <h3>Rellena tu CV</h3>

    <form action="#" method="post">

        Nombre<br>
        <input type="text" name="nombre" maxlength="30">
        <br>

        Apellidos<br>
        <input type="text" name="apellidos" maxlength="80" size="35">
        <br>

        Contraseña<br>
        <input type="password" name="contraseña" maxlength="10">
        <br>

        DNI<br>
        <input type="text" name="dni" minlength="9" maxlength="9" size="7">
        <br>

        Sexo<br>
        <input type="radio" name="sexo" value="hombre" checked> Hombre
        <br>
        <input type="radio" name="sexo" value="mujer"> Mujer
        <br><br>

        Incluir mi foto
        <input type="file" name="foto">
        <br><br>

        <input type="checkbox" name="boletin" checked>
        Suscribirme al boletín de novedades
        <br><br>

        <input type="submit" value="Guardar cambios">
        <input type="reset" value="Borrar los datos introducidos">

    </form>

</body>
</html>
